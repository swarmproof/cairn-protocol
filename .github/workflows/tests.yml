name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pin to the stable channel so CI does not silently drift onto a newer
          # nightly whose cheatcode behavior differs from local (e.g. stricter
          # vm.prank rules), which caused green-local/red-CI failures.
          version: stable

      - name: Run tests
        working-directory: contracts
        run: forge test
